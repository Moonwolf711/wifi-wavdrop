; Wireless USB Bridge - ESP32-S3 Firmware
; ESP-IDF Platform with Real USB Host Support

[env:esp32s3-usb-host]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; ESP-IDF Components
platform_packages =
    platformio/framework-espidf @ ~3.50005.0

; Project dependencies (ESP-IDF components)
lib_deps =
    espressif/usb_host_msc@^1.1.3
    bblanchon/ArduinoJson@^6.21.3

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DWU_DEBUG=1

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Partition table (need space for fatfs)
board_build.partitions = default.csv
