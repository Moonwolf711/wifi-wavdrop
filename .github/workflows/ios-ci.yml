name: iOS CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  XCODE_VERSION: '15.0'
  IOS_SIMULATOR: 'iPhone 15 Pro'
  IOS_VERSION: '17.0'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14

    strategy:
      matrix:
        include:
          - destination: 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0'
            name: 'iPhone 15 Pro (iOS 17.0)'
          - destination: 'platform=iOS Simulator,name=iPhone 14,OS=17.0'
            name: 'iPhone 14 (iOS 17.0)'
          - destination: 'platform=iOS Simulator,name=iPad Pro (12.9-inch) (6th generation),OS=17.0'
            name: 'iPad Pro 12.9" (iOS 17.0)'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          swift package resolve

      - name: Build
        run: |
          swift build -c debug

      - name: Run tests
        run: |
          swift test --enable-code-coverage

      - name: Generate code coverage report
        if: matrix.name == 'iPhone 15 Pro (iOS 17.0)'
        run: |
          xcrun llvm-cov export \
            .build/debug/WaveDropPackageTests.xctest/Contents/MacOS/WaveDropPackageTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            -format=lcov > coverage.lcov

      - name: Upload coverage to Codecov
        if: matrix.name == 'iPhone 15 Pro (iOS 17.0)'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.lcov
          flags: unittests
          name: wavedrop-coverage
          fail_ci_if_error: false

  swiftlint:
    name: SwiftLint
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint lint --reporter github-actions-logging

  archive:
    name: Archive
    runs-on: macos-14
    needs: [build-and-test, swiftlint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Build release
        run: |
          swift build -c release

      - name: Create archive
        run: |
          mkdir -p build
          tar -czf build/WaveDrop-release.tar.gz .build/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: WaveDrop-release
          path: build/WaveDrop-release.tar.gz
          retention-days: 30

  testflight-deploy:
    name: Deploy to TestFlight
    runs-on: macos-14
    needs: archive
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive and Export IPA
        run: |
          # Note: This requires an actual Xcode project, not just SPM
          # For SPM-only projects, you'd need to generate an Xcode project first
          # swift package generate-xcodeproj
          echo "Archive step - requires Xcode project configuration"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # Upload using altool or xcrun altool
          # xcrun altool --upload-app -t ios -f build/WaveDrop.ipa \
          #   --apiKey $APP_STORE_CONNECT_API_KEY \
          #   --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          echo "Upload to TestFlight step - requires proper credentials"

      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [build-and-test, swiftlint]
    if: always()

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'WaveDrop iOS CI Pipeline'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
